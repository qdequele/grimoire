# Production deploy, in the order the app needs: database, then Edge Functions, then the site.
# The app calls RPCs and function signatures that only exist after the first two steps, so Vercel's
# own deploy of `main` is turned off (vercel.json, git.deploymentEnabled) and the site is deployed
# from here, after Supabase. Preview deploys of other branches still come from Vercel's Git hook.
#
# Secrets (GitHub → Settings → Environments → production):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the hosted database password
#   VERCEL_TOKEN           vercel.com/account/tokens
# Variables (same place): SUPABASE_PROJECT_ID, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  supabase:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: supabase link --project-ref "$PROJECT_ID"
      - name: Pending migrations
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_ID"

  site:
    needs: supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx vercel@65.11.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@65.11.0 build --prod --token="$VERCEL_TOKEN"
      - run: pnpm dlx vercel@65.11.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
