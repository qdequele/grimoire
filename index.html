<!doctype html>
<html lang="fr" class="dark" data-skin="deco">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Grimoire</title>
    <meta name="description" content="Le compagnon du gardien pour les jeux d'enquête et d'horreur au d100 : l'histoire scène par scène, les dés, les fiches des joueurs sur leur téléphone et un écran d'ambiance pour la table." />
    <meta property="og:title" content="Grimoire · Le compagnon du gardien" />
    <meta property="og:description" content="L'histoire scène par scène, les dés, les fiches des joueurs sur leur téléphone et un écran d'ambiance pour la table." />
    <!-- Apply the saved skin before first paint (same key as the legacy app). -->
    <script>
      try {
        var skin = localStorage.getItem('gardien-skin')
        if (skin === 'classic' || skin === 'deco') document.documentElement.dataset.skin = skin
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Limelight&family=Josefin+Sans:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
